name: Linux milestone
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 18 * * *'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python3 -m unittest discover -s tools -p "test_*.py"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo test --features portable
      - run: cargo build --release
      - run: cargo run --release -- examples/milestone.ijs
  reference:
    strategy:
      fail-fast: false
      matrix:
        variant: [j64, j64avx2]
        backend: [default, portable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch the pinned comparison source
        run: |
          git init /tmp/jsource
          git -C /tmp/jsource remote add origin https://github.com/jsoftware/jsource.git
          git -C /tmp/jsource fetch --depth 1 origin 13994ffa1ed5f06f79fad6e9822a7ed2d29b1528
          git -C /tmp/jsource checkout --detach FETCH_HEAD
      - run: python3 tools/build_reference.py --source /tmp/jsource --variant ${{ matrix.variant }}
      - run: cargo build --release
      - if: matrix.backend == 'portable'
        run: cargo build --release --features portable
      - name: Word formation differential gate
        env:
          J_LIBRARY: ${{ github.workspace }}/.reference/bin/linux/${{ matrix.variant }}/libj.so
        run: |
          mkdir -p reports
          python3 tools/word_conformance.py \
            --reference-revision 13994ffa1ed5f06f79fad6e9822a7ed2d29b1528 \
            --report "reports/word-conformance-${{ matrix.variant }}-${{ matrix.backend }}.json"
      - name: Differential gate
        env:
          J_LIBRARY: ${{ github.workspace }}/.reference/bin/linux/${{ matrix.variant }}/libj.so
        run: |
          rounds=100
          seed=20260926
          if [ "${{ github.event_name }}" = schedule ]; then
            rounds=1000
            seed=$(date -u +%Y%m%d)
          fi
          python3 tools/conformance.py --seed "$seed" --rounds "$rounds" --allow-known-j64 --reference-revision 13994ffa1ed5f06f79fad6e9822a7ed2d29b1528
      - name: FW-04 pinned search three-way differential gate
        env:
          J_LIBRARY: ${{ github.workspace }}/.reference/bin/linux/${{ matrix.variant }}/libj.so
        run: |
          python3 tools/search_three_way.py \
            --reference-revision 13994ffa1ed5f06f79fad6e9822a7ed2d29b1528 \
            --report "reports/search-three-way-${{ matrix.variant }}-${{ matrix.backend }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.variant }}-${{ matrix.backend }}
          path: |
            reports/conformance*
            reports/word-conformance-*.json
            reports/search-three-way-*.json
            .reference/manifest*.json
            .reference/build.log
